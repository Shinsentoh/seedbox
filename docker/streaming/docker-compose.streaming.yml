version: "3.7"

name: streaming
services:
    crosswatch:
        image: ghcr.io/cenodude/crosswatch:latest
        container_name: crosswatch
        environment:
            - TZ=${TZ}
            - APP_UID=${PUID}
            - APP_GID=${PGID}
            - APP_USER=${MEDIA_USER}
            - APP_GROUP=${MEDIA_USER}
        volumes:
            - configCrosswatch:/config
        restart: unless-stopped
        networks:
            - traefik-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.services.crosswatch.loadbalancer.server.port=8787"
            - "traefik.http.routers.crosswatch.rule=Host(`${CROSSWATCH_SUB_DOMAIN}.${TRAEFIK_DOMAIN}`)"
            # do not use auth middleware because trakt/simkl apis needs access to this api.
            - "traefik.http.routers.crosswatch.service=crosswatch"

    # Addons

    aiometadata:
        image: ghcr.io/cedya77/aiometadata:latest
        container_name: aiometadata
        restart: unless-stopped
        expose:
            - 3232
        environment:
            - PGID=${PGID}
            - PUID=${PUID}
            - TZ=${TZ}
            - PORT=3232
            - TMDB_API=${TMDB_API_KEY?}
            - TVDB_API_KEY=${TVDB_API_KEY?}
            - FANART_API_KEY=${FANART_API_KEY?}
            - MDBLIST_API_KEY=${MDBLIST_API_KEY?}
            - RPDB_API_KEY=${RPDB_API_KEY?}
            - GEMINI_API_KEY=${GEMINI_API_KEY?}
            - HOST_NAME=${AIOMETADATA_HOSTNAME?}
            - NODE_ENV=production
            - REDIS_URL=redis://aiometadata-redis:6379
            - META_TTL=604800
            - CATALOG_TTL=86400
            - CATALOG_LIST_ITEMS_SIZE=${CATALOG_LIST_ITEMS_SIZE}
            - LOG_LEVEL=info
            - ADMIN_KEY=${ADMIN_KEY?}
            - ADDON_PASSWORD=${ADMIN_KEY?}
            - TMDB_SOCKS_PROXY_URL=${TMDB_SOCKS_PROXY_URL?}
            - DATABASE_URI=sqlite://addon/data/db.sqlite
            - CACHE_WARM_LANGUAGE=${CACHE_WARM_LANGUAGE?}
            - DISABLE_GUEST_MODE=true
        labels:
            - "traefik.enable=true"
            - "traefik.http.services.aiometadata.loadbalancer.server.port=3232"
            - "traefik.http.routers.aiometadata.rule=Host(`${AIOMETADATA_SUB_DOMAIN}.${TRAEFIK_DOMAIN}`)"
            # do not use auth middleware because nuvio needs access to this api.
            # use ip/vpn whitelisting instead (Traefik ?)
            - "traefik.http.routers.aiometadata.service=aiometadata"
        volumes:
            - configAioMetadata:/app/addon/data
        networks:
            - default
            - traefik-network
        depends_on:
            aiometadata-redis:
                condition: service_healthy

    aiometadata-redis:
        image: redis:latest
        container_name: aiometadata-redis
        restart: unless-stopped
        volumes:
            - configAioMetadata-cache:/data
        command: redis-server --appendonly yes --save 60 1
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    subsense: # gestion des sous titres
        image: nepiraw/stremio-subsense:latest
        container_name: subsense
        restart: unless-stopped
        environment:
            - PGID=${PGID}
            - PUID=${PUID}
            - TZ=${TZ}
            - PORT=3100
            - SUBSENSE_ENCRYPTION_KEY=${SUBSENSE_ENCRYPTION_KEY}               # REQUIRED - encryption key for user API keys
            # --- Provider API keys ---
            # - WYZIE_API_KEYS=             # REQUIRED for wyzie provider (comma-separated for multiple keys)
            # - BETASERIES_API_KEY=         # Optional - BetaSeries (French/English)
            - TVDB_API_KEY=${TVDB_API_KEY}  # Optional - Gestdown provider (TVDB lookup)
            - TMDB_API_KEY=${TMDB_API_KEY}  # Optional - Gestdown fallback (TMDB lookup)
            - ANIDB_CLIENT=${ANIDB_CLIENT}
            - ANIDB_CLIENT_VER=${ANIDB_CLIENT_VER}
        labels:
            - "traefik.enable=true"
            - "traefik.http.services.subsense.loadbalancer.server.port=3100"
            - "traefik.http.routers.subsense.rule=Host(`${SUBSENSE_SUB_DOMAIN}.${TRAEFIK_DOMAIN}`)"
            # do not use auth middleware because nuvio needs access to this api.
            # use ip/vpn whitelisting instead (Traefik ?)
            - "traefik.http.routers.subsense.service=subsense"
        networks:
            - traefik-network
        volumes:
            - configSubsense:/app/data  # Persist cache database

networks:
    default:
        name: streaming-private
        internal: true

    traefik-network:
        external: true

volumes:

    configAioMetadata:
        driver: local-persist
        driver_opts:
            mountpoint: ${BASE_PATH}/${CONFIG_DIR_NAME}/aiometadata

    configAioMetadata-cache:
        driver: local-persist
        driver_opts:
            mountpoint: ${BASE_PATH}/${CONFIG_DIR_NAME}/aiometadata/cache

    configCrosswatch:
        driver: local-persist
        driver_opts:
            mountpoint: ${BASE_PATH}/${CONFIG_DIR_NAME}/crosswatch

    configSubsense:
        driver: local-persist
        driver_opts:
            mountpoint: ${BASE_PATH}/${CONFIG_DIR_NAME}/subsense